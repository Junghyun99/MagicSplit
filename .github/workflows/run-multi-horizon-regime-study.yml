name: Run Multi-Horizon Regime Study

on:
  workflow_dispatch:
    inputs:
      initial_cash:
        description: '각 군의 초기 자본 (KRW)'
        required: false
        default: '1000000000'
        type: string
      selection_end:
        description: '선택 구간 종료일'
        required: false
        default: '2022-12-30'
        type: string
      validation_end:
        description: '검증 구간 종료일'
        required: false
        default: '2026-08-13'
        type: string

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run controlled legacy-channel versus three-layer study
      env:
        INITIAL_CASH: ${{ inputs.initial_cash }}
        SELECTION_END: ${{ inputs.selection_end }}
        VALIDATION_END: ${{ inputs.validation_end }}
      run: |
        python scripts/run_multi_horizon_regime_study.py \
          --initial-cash "$INITIAL_CASH" \
          --period "selection:2016-01-01:$SELECTION_END" \
          --period "validation:2023-01-02:$VALIDATION_END"

    - name: Commit, rebase, and push study result
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add --force docs/data/backtest-studies/multi-horizon-regime/ || true
        if ! git diff --cached --quiet; then
          git commit -m "multi-horizon regime study update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
        else
          echo "No study result changes to commit"
        fi
